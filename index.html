<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0708">
<title>подожди...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0708;
    --cream:#f0e6d2;
    --cream-dim:#c9bfae;
    --muted:#8a7f70;
    --amber:#d4a574;
    --amber-hi:#e8c090;
    --rose:#e8a5a5;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:#000;
    color:var(--cream);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .phone{
    position:relative;
    width:100%;
    max-width:420px;
    height:100vh;
    background:
      radial-gradient(ellipse 700px 500px at 50% 30%, rgba(212,165,116,.07), transparent 65%),
      radial-gradient(ellipse 500px 400px at 50% 100%, rgba(232,165,165,.04), transparent 70%),
      var(--bg);
    overflow:hidden;
  }

  @media (min-width:480px) and (min-height:760px){
    .phone{
      height:880px;
      border-radius:44px;
      box-shadow:0 0 0 10px #0a0a0a, 0 0 0 12px #1a1a1a, 0 40px 100px rgba(0,0,0,.85);
    }
  }

  /* Виньетка */
  .phone::after{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
    z-index:1;
  }

  /* Пылинки */
  .dust{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .dust-particle{
    position:absolute;
    width:2px;height:2px;
    background:rgba(212,165,116,.55);
    border-radius:50%;
    animation:drift linear infinite;
    opacity:.4;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0);opacity:0;}
    10%{opacity:.5;}
    90%{opacity:.5;}
    100%{transform:translateY(-100vh) translateX(20px);opacity:0;}
  }

  /* Центральный контент */
  .center{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 26px 200px;
    pointer-events:none;
    text-align:center;
  }

  .kicker{
    font-family:'Caveat',cursive;
    font-size:22px;
    color:var(--amber);
    margin-bottom:24px;
    letter-spacing:.04em;
    opacity:0;
    animation:fade-up .9s .3s forwards;
  }

  .title{
    font-family:'Caveat',cursive;
    font-size:46px;
    line-height:1.05;
    color:var(--cream);
    margin-bottom:20px;
    font-weight:700;
    opacity:0;
    animation:fade-up 1s .55s forwards;
  }
  .title em{
    font-style:normal;
    color:var(--amber);
    display:inline-block;
    position:relative;
  }
  .title em::after{
    content:'';
    position:absolute;
    left:0;right:0;bottom:5px;
    height:1.5px;
    background:linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:.4;
  }

  .sub{
    font-family:'Lora',serif;
    font-style:italic;
    font-size:15px;
    line-height:1.7;
    color:var(--cream-dim);
    max-width:290px;
    opacity:0;
    animation:fade-up 1s .9s forwards;
  }

  @keyframes fade-up{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ============ КНОПКА ============ */
  .dodge-btn{
    position:absolute;
    z-index:10;
    padding:16px 38px;
    background:linear-gradient(135deg, rgba(212,165,116,.18), rgba(232,165,165,.12));
    border:1.5px solid rgba(212,165,116,.55);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:lowercase;
    border-radius:100px;
    cursor:pointer;
    transition:
      left 0.14s cubic-bezier(.4,0,.2,1),
      top  0.14s cubic-bezier(.4,0,.2,1),
      box-shadow .3s ease,
      background .3s ease,
      border-color .3s ease,
      opacity .8s ease 1.6s;
    box-shadow:
      0 6px 24px rgba(212,165,116,.18),
      inset 0 0 20px rgba(212,165,116,.06);
    opacity:0;
    white-space:nowrap;
    outline:none;
  }
  .dodge-btn.appear{
    opacity:1;
  }
  .dodge-btn:hover,
  .dodge-btn:focus{
    box-shadow:
      0 10px 32px rgba(212,165,116,.35),
      inset 0 0 24px rgba(212,165,116,.12);
    border-color:var(--amber-hi);
    background:linear-gradient(135deg, rgba(212,165,116,.28), rgba(232,165,165,.18));
  }

  /* Лёгкое дрожание — кнопка «живая» */
  .dodge-btn.shiver{
    animation:shiver .35s ease;
  }
  @keyframes shiver{
    0%,100%{transform:rotate(0);}
    25%{transform:rotate(-2.5deg);}
    75%{transform:rotate(2.5deg);}
  }

  /* ============ ПОДКОЛЫ ============ */
  .taunt{
    position:absolute;
    z-index:15;
    font-family:'Caveat',cursive;
    font-size:22px;
    color:var(--amber);
    text-shadow:0 0 20px rgba(212,165,116,.5);
    pointer-events:none;
    transform:translate(-50%,-50%);
    animation:taunt-float 1.2s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes taunt-float{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.7);}
    20%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}
    40%{transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0;transform:translate(-50%,-120%) scale(1);}
  }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="dust" id="dust"></div>

  <div class="center">
    <p class="kicker">для Сонечки голд2</p>
    <h1 class="title">я хочу тебе<br><em>кое-что сказать...</em></h1>
    <p class="sub">это важно.<br>ты правда хочешь узнать?</p>
  </div>

  <button class="dodge-btn" id="dodgeBtn" type="button" tabindex="-1" aria-label="Дальше">дальше →</button>
</div>

<script>
  const phone = document.getElementById('phone');
  const btn   = document.getElementById('dodgeBtn');

  /* ================= ПЫЛИНКИ ================= */
  (function createDust(){
    const layer = document.getElementById('dust');
    for (let i = 0; i < 20; i++) {
      const d = document.createElement('div');
      d.className = 'dust-particle';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = (50 + Math.random() * 50) + '%';
      d.style.animationDuration = (14 + Math.random() * 12) + 's';
      d.style.animationDelay = (Math.random() * 10) + 's';
      d.style.opacity = 0.15 + Math.random() * 0.35;
      layer.appendChild(d);
    }
  })();

  /* ================= ПОЗИЦИЯ ================= */
  function placeInitially() {
    const pRect = phone.getBoundingClientRect();
    const bRect = btn.getBoundingClientRect();
    const x = (pRect.width - bRect.width) / 2;
    const y = pRect.height * 0.68;
    btn.style.left = x + 'px';
    btn.style.top  = y + 'px';
    btn.classList.add('appear');
  }

  window.addEventListener('load', () => {
    /* небольшая задержка — чтобы кнопка появилась после текста */
    setTimeout(placeInitially, 1400);
  });

  window.addEventListener('resize', () => {
    /* на ресайз — подтягиваем кнопку в допустимые границы */
    const b = getBounds();
    const x = Math.min(Math.max(parseFloat(btn.style.left) || 0, b.minX), b.maxX);
    const y = Math.min(Math.max(parseFloat(btn.style.top)  || 0, b.minY), b.maxY);
    btn.style.left = x + 'px';
    btn.style.top  = y + 'px';
  });

  /* ================= ГРАНИЦЫ ================= */
  function getBounds() {
    const pRect = phone.getBoundingClientRect();
    const bRect = btn.getBoundingClientRect();
    const pad      = 22;
    const padTop   = 110;
    const padBottom= 120;
    return {
      minX: pad,
      maxX: Math.max(pad, pRect.width - bRect.width - pad),
      minY: padTop,
      maxY: Math.max(padTop, pRect.height - bRect.height - padBottom)
    };
  }

  /* ================= ПОДКОЛЫ ================= */
  const earlyTaunts = ['не так быстро', 'ой', 'ха-ха', 'не-а', 'почти!', 'не сегодня'];
  const lateTaunts  = ['ещё разок?', 'ахах', 'ловкость рук', 'наивная', 'попробуй ещё', 'не судьба', 'мимо'];

  let attempts = 0;

  function showTaunt(centerX, centerY) {
    const pool = attempts <= 3 ? earlyTaunts : lateTaunts;
    const text = pool[Math.floor(Math.random() * pool.length)];

    const t = document.createElement('div');
    t.className = 'taunt';
    t.textContent = text;
    t.style.left = centerX + 'px';
    t.style.top  = centerY + 'px';
    phone.appendChild(t);
    setTimeout(() => t.remove(), 1250);
  }

  /* ================= УКЛОНЕНИЕ ================= */
  let lastDodgeAt = 0;

  function dodge() {
    const now = Date.now();
    /* троттлинг: не чаще, чем раз в 120 мс — чтобы не было хаоса */
    if (now - lastDodgeAt < 120) return;
    lastDodgeAt = now;

    attempts++;

    const b = getBounds();
    const pRect = phone.getBoundingClientRect();
    const curRect = btn.getBoundingClientRect();
    const curCX = curRect.left + curRect.width  / 2 - pRect.left;
    const curCY = curRect.top  + curRect.height / 2 - pRect.top;

    /* пытаемся найти новую точку не ближе 90px от текущей */
    let newX, newY, tries = 0;
    const minDist = 90;

    do {
      newX = b.minX + Math.random() * (b.maxX - b.minX);
      newY = b.minY + Math.random() * (b.maxY - b.minY);
      tries++;
    } while (
      tries < 12 &&
      Math.abs(newX + curRect.width  / 2 - curCX) < minDist &&
      Math.abs(newY + curRect.height / 2 - curCY) < minDist
    );

    btn.style.left = newX + 'px';
    btn.style.top  = newY + 'px';

    /* короткая дрожь */
    btn.classList.remove('shiver');
    void btn.offsetWidth;
    btn.classList.add('shiver');

    /* подкол на старом месте */
    showTaunt(curCX, curCY);

    /* вибрация, если поддерживается */
    if (navigator.vibrate) navigator.vibrate(12);
  }

  /* ================= ОБРАБОТЧИКИ ================= */

  /* Десктоп: только подвели мышку — кнопка ушла */
  btn.addEventListener('mouseenter', (e) => {
    e.preventDefault();
    dodge();
  });

  /* Мобилка: тап по кнопке — гасим и уходим */
  btn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, { passive: false });

  /* На всякий случай: pointerdown */
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dodge();
  });

  /* Последний рубеж: если вдруг каким-то чудом клик всё-таки случится */
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dodge();
  });

  /* Клавиатура: Enter/Space — тоже уклон */
  btn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      dodge();
    }
  });

  /* На случай экзотики: клик на документе, который попал в кнопку */
  document.addEventListener('click', (e) => {
    if (e.target === btn || btn.contains(e.target)) {
      e.preventDefault();
      e.stopPropagation();
      dodge();
    }
  }, true);

  /* ================= ВНЕЗАПНОЕ ДВИЖЕНИЕ КНОПКИ ================= */
  /* Раз в 4-6 секунд кнопка «нервно» дёргается сама по себе — добавляет интриги */
  setInterval(() => {
    if (attempts === 0) {
      /* пока не трогали — просто мелкая дрожь */
      btn.classList.remove('shiver');
      void btn.offsetWidth;
      btn.classList.add('shiver');
    }
  }, 5000);

</script>

</body>
</html>
